<div class="auth-container">
  <div class="auth-box">
    <!-- Toggle Tabs -->
    <div class="auth-tabs" *ngIf="step !== 'otp'">
      <button [class.active]="mode === 'login'" (click)="mode = 'login'">Login</button>
      <button [class.active]="mode === 'register'" (click)="mode = 'register'">Register</button>
    </div>

    <!-- Step 1: Input Fields -->
    <form *ngIf="step === 'inputs'" (ngSubmit)="submitInitialFields()">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" [(ngModel)]="authData.phone" name="phone" required placeholder="e.g. 0700000000">
      </div>
      
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" [(ngModel)]="authData.accountNo" name="accountNo" required>
      </div>

      <!-- Registration Fields Only -->
      <ng-container *ngIf="mode === 'register'">
        <div class="form-group">
          <label>Bank Name</label>
          <input type="text" [(ngModel)]="authData.bankName" name="bankName" required>
        </div>
      </ng-container>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="authData.password" name="password" required>
      </div>

      <button type="submit" class="submit-btn">{{ mode === 'login' ? 'Sign In' : 'Sign Up' }}</button>
    </form>

    <!-- Step 2: OTP Entry Verification -->
    <div class="otp-view" *ngIf="step === 'otp'">
      <h3>Verify Verification Identity</h3>
      <p>We sent a verification code to your mobile device.</p>
      <div class="form-group">
        <label>Enter OTP Code</label>
        <input type="text" [(ngModel)]="otpCode" max-length="6" placeholder="XXXXXX">
      </div>
      <button class="submit-btn" (click)="verifyOtpCode()">Verify & Complete</button>
    </div>
  </div>
</div>
